<h1>Site <span class="accent">portal</span></h1>
<div class="subnav">
  <a href="/portal" class="{{ 'active' if active=='dashboard' }}">Dashboard</a>

  <a href="/portal/artifacts" class="{{ 'active' if active=='artifacts' }}">Artifacts</a>

  </form>
</div>
