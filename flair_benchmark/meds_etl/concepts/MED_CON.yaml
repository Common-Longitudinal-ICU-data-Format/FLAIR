elf_version: "1.0.0"
subject_id_col: patient_id

medication_admin_continuous:
  medication:
    code:
      - MED_CON
      - col(med_category)
      - col(med_dose_unit_converted)
      - col(mar_action_category)
    time: col(admin_dttm)
    time_format: "%Y-%m-%d %H:%M:%S"
    numeric_value: med_dose_converted
    med_dose_unit: med_dose_unit
    med_route_category: med_route_category
    hospitalization_id: hospitalization_id

    unit_conversion:
      enabled: true
      # override: a preferred-unit key naming a med this site never charts is
      # normal, so downgrade clifpy's error to a log line.
      override: true
      # allow_other_meds MUST stay true. preferred_units is a CONVERSION table,
      # not a vocabulary: false makes its key set a row filter, and every mCIDE
      # med_category without an entry here is dropped from the extract. clifpy
      # already falls back to base units (mcg/min, ml/min, u/min) for a category
      # with no preferred unit, so nothing is lost by letting those rows through.
      allow_other_meds: true
      # Keys must be exact CLIF 2.1 mCIDE med_category values — a misspelled key
      # matches nothing and the intended conversion silently never happens.
      preferred_units:
        acetaminophen: mg/min
        albumin: ml/hr
        alteplase: mg/hr
        aminocaproic_acid: g/hr
        aminophylline: mg/kg/hr
        amiodarone: mg/min
        angiotensin: ng/kg/min
        argatroban: mcg/kg/min
        bivalirudin: mg/kg/hr
        bumetanide: mg/hr
        cisatracurium: mcg/kg/min
        clevidipine: mg/hr
        dexmedetomidine: mcg/kg/hr
        dextrose_5_water: ml/hr
        dextrose_other: ml/hr
        diltiazem: mg/hr
        dobutamine: mcg/kg/min
        dopamine: mcg/kg/min
        epinephrine: mcg/kg/min
        epoprostenol: ng/kg/min
        eptifibatide: mcg/kg/min
        esmolol: mcg/kg/min
        fentanyl: mcg/kg/hr
        furosemide: mg/hr
        heparin: u/hr
        hydromorphone: mg/hr
        insulin: u/hr
        ketamine: mcg/kg/hr
        labetalol: mg/min
        lidocaine: mg/min
        lorazepam: mg/hr
        magnesium_sulfate: g/hr
        midazolam: mg/hr
        milrinone: mcg/kg/min
        morphine: mg/hr
        naloxone: mg/hr
        nicardipine: mg/hr
        nitroglycerin: mcg/kg/min
        nitroprusside: mcg/kg/min
        norepinephrine: mcg/kg/min
        octreotide: mcg/hr
        pantoprazole: mg/hr
        pentobarbital: mcg/kg/hr
        phenylephrine: mcg/kg/min
        procainamide: mg/min
        propofol: mcg/kg/min
        remifentanil: mcg/kg/min
        rocuronium: mcg/kg/min
        sodium_chloride: ml/hr
        tpn: ml/hr
        treprostinil: ng/kg/min
        vasopressin: u/min
        vecuronium: mcg/kg/min
